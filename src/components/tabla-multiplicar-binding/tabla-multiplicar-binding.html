<section class="tabla-container">
  <h1>Model Binding</h1>
  <form class="tabla-form" #form="ngForm" (ngSubmit)="generarTabla()">
  <label for="numero">Número:</label>
  <input type="number" id="numero" name="numeroIntroducido" [(ngModel)]="numeroIntroducido" /><br />
  <button type="submit">Generar tabla</button>
  </form>
  <h2>Versión 1</h2>
  <ul class="tabla-lista">
    @for (item of items; track item) {
      <li>{{ item }}</li>
    }
  </ul>
  <h2>Versión 2</h2>
  <div class="tabla-resultados">
    @for (item of items; track item; let i = $index) {
      <p>{{ numero }} * {{ i + 1 }} = {{ item }}</p>
    }
  </div>
</section>
